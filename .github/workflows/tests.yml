name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer format:test

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer phpstan

  tests:
    name: Pest (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The plugin's floor is 8.3 (composer platform pin), so test it there
        # too — an 8.4-only matrix would not catch a syntax or stdlib feature
        # that the declared minimum cannot run.
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer test

  translations:
    name: Translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      # No composer install: the check only parses languages/*.po.
      - run: composer translate:check

  plugin-check:
    name: Plugin Check (WordPress.org)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none
          tools: composer, wp-cli
      - run: composer install --no-interaction --prefer-dist
      - name: Install wp-cli dist-archive
        # setup-php writes a github-oauth entry into the global Composer config,
        # and wp package install reuses it - it failed here with "github oauth
        # token contains invalid characters". COMPOSER_AUTH takes precedence
        # over that file, so setting it explicitly sidesteps whatever ends up
        # in there and also lifts the anonymous API rate limit.
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          composer global config --list 2>/dev/null | grep -iE '^\[github-oauth' || echo 'no github-oauth in the global config'
          wp package install wp-cli/dist-archive-command --allow-root
      # Runs the same checker WordPress.org's review bot runs, against the
      # BUILT zip rather than the checkout, so .distignore and the Strauss
      # scoping are covered too. Catches "Tested up to" drift on every new
      # WordPress release, which is otherwise silent until the plugin drops
      # out of wp.org search.
      - run: composer pcp

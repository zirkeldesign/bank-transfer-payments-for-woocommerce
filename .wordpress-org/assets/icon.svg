<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <!--
      userSpaceOnUse (not the default objectBoundingBox) so every shape samples
      the SAME gradient. The badge's cut-out ring below relies on this: painted
      with url(#g) it becomes invisible against the background circle.
    -->
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="256" y2="256">
      <stop offset="0%" stop-color="#0e3a63"/>
      <stop offset="100%" stop-color="#0aa2dd"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="128" cy="128" r="128" fill="url(#g)"/>

  <!-- Bank facade: pediment, architrave, columns, base -->
  <g fill="white">
    <path d="M 112 56 L 168 88 L 56 88 Z"/>
    <rect x="56" y="90" width="112" height="10" rx="2"/>
    <rect x="60" y="102" width="13" height="48"/>
    <rect x="90" y="102" width="13" height="48"/>
    <rect x="121" y="102" width="13" height="48"/>
    <rect x="151" y="102" width="13" height="48"/>
    <rect x="50" y="152" width="124" height="12" rx="3"/>
  </g>

  <!-- Reconciled badge: the automatic match is the product, so it gets a mark -->
  <circle cx="190" cy="186" r="42" fill="url(#g)"/>
  <circle cx="190" cy="186" r="32" fill="white"/>
  <path d="M 176 187 L 186 198 L 205 175" stroke="url(#g)" stroke-width="11" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
